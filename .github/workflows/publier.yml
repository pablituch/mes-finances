name: Publier une version

# Se lance à chaque envoi sur la branche main (ou à la main : onglet « Actions » → « Run workflow »).
# Ne construit que si le numéro de "version" de package.json n'a pas encore été publié.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # pour créer la « Release » avec l'installateur

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cette version existe-t-elle déjà ?
        id: v
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=$(node -p "require('./package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if gh release view "v$V" >/dev/null 2>&1; then echo "nouvelle=non" >> "$GITHUB_OUTPUT"; echo "v$V déjà publiée : rien à faire."; else echo "nouvelle=oui" >> "$GITHUB_OUTPUT"; fi
      - if: steps.v.outputs.nouvelle == 'oui'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: steps.v.outputs.nouvelle == 'oui'
        run: npm install --no-audit --no-fund
      # Construit MesFinances-Installation.exe et le publie dans la Release « vX.Y.Z »,
      # avec le contenu de NOUVEAUTES.md comme description (affiché dans l'app lors de la mise à jour).
      - if: steps.v.outputs.nouvelle == 'oui'
        run: npx electron-builder --win nsis --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
